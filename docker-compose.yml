# Opis wszystkich kontenerów projektu. Uruchomienie całości: docker compose up --build
#
# Kontenery widzą się nawzajem po NAZWACH USŁUG (np. "broker", "mysql"),
# a nie po "localhost" (w kontenerze localhost oznacza ten sam kontener).

services:

  # Broker MQTT - pośrednik, przez którego płyną wiadomości z pojazdów.
  broker:
    image: hivemq/hivemq-ce          # gotowy obraz z Docker Hub, nic nie trzeba konfigurować
    container_name: fleet-broker
    ports:
      - "1883:1883"                  # port MQTT udostępniony na twoim komputerze (np. dla MQTTX)

  # Baza danych MySQL.
  mysql:
    image: mysql:8.4
    container_name: fleet-mysql
    environment:
      # Wartości po ":-" to domyślne (tylko do lokalnego developmentu).
      # Własne można ustawić w pliku .env (wzór w .env.example).
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fleet}
      MYSQL_USER: ${MYSQL_USER:-fleet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fleet_dev_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pass}
    ports:
      - "3306:3306"                  # żeby dało się podejrzeć bazę z DBeavera / MySQL Workbench
    volumes:
      - mysqldata:/var/lib/mysql                                     # dane bazy przetrwają restart kontenera
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro        # schemat tworzy się przy pierwszym starcie
    healthcheck:
      # Przez TCP (-h 127.0.0.1): baza odpowiada tak dopiero po zakończeniu pierwszego startu (i init.sql).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Symulator pojazdów - wysyła pozycje GPS do brokera.
  simulator:
    build: ./simulator               # buduje obraz według simulator/Dockerfile
    container_name: fleet-simulator
    environment:
      MQTT_HOST: broker              # adres brokera = nazwa usługi powyżej
    depends_on:
      - broker
    restart: unless-stopped          # jeśli broker jeszcze nie wstał, symulator spróbuje ponownie

  # TODO (osoba A): ingestor - odbiera wiadomości z brokera i zapisuje je do bazy.
  # ingestor:
  #   build: ./ingestor
  #   environment:
  #     MQTT_HOST: broker
  #     DB_HOST: mysql
  #   depends_on:
  #     mysql:
  #       condition: service_healthy

  # TODO (osoba B): REST API (Flask) - udostępnia dane z bazy (i serwuje frontend).
  # api:
  #   build: ./api
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     DB_HOST: mysql
  #   depends_on:
  #     mysql:
  #       condition: service_healthy

volumes:
  mysqldata:

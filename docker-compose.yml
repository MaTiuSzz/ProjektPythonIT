# Opis wszystkich kontenerów projektu. Uruchomienie całości: docker compose up --build
#
# Kontenery widzą się nawzajem po NAZWACH USŁUG (np. "broker", "postgres"),
# a nie po "localhost" (w kontenerze localhost oznacza ten sam kontener).

services:

  # Broker MQTT - pośrednik, przez którego płyną wiadomości z pojazdów.
  broker:
    image: hivemq/hivemq-ce          # gotowy obraz z Docker Hub, nic nie trzeba konfigurować
    container_name: fleet-broker
    ports:
      - "1883:1883"                  # port MQTT udostępniony na twoim komputerze (np. dla MQTTX)

  # Baza danych PostgreSQL.
  postgres:
    image: postgres:16
    container_name: fleet-postgres
    environment:
      # Wartości po ":-" to domyślne (tylko do lokalnego developmentu).
      # Własne można ustawić w pliku .env (wzór w .env.example).
      POSTGRES_DB: ${POSTGRES_DB:-fleet}
      POSTGRES_USER: ${POSTGRES_USER:-fleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet_dev_pass}
    ports:
      - "5432:5432"                  # żeby dało się podejrzeć bazę z DBeavera / pgAdmina
    volumes:
      - pgdata:/var/lib/postgresql/data                              # dane bazy przetrwają restart kontenera
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro        # schemat tworzy się przy pierwszym starcie
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleet} -d ${POSTGRES_DB:-fleet}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Symulator pojazdów - wysyła pozycje GPS do brokera.
  simulator:
    build: ./simulator               # buduje obraz według simulator/Dockerfile
    container_name: fleet-simulator
    environment:
      MQTT_HOST: broker              # adres brokera = nazwa usługi powyżej
    depends_on:
      - broker
    restart: unless-stopped          # jeśli broker jeszcze nie wstał, symulator spróbuje ponownie

  # TODO (osoba A): ingestor - odbiera wiadomości z brokera i zapisuje je do bazy.
  # ingestor:
  #   build: ./ingestor
  #   environment:
  #     MQTT_HOST: broker
  #     DB_HOST: postgres
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  # TODO (osoba B): REST API - udostępnia dane z bazy (i serwuje frontend).
  # api:
  #   build: ./api
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     DB_HOST: postgres
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  pgdata:
